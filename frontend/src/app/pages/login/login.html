<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #3b9845;">
  <div class="container">
    <a class="navbar-brand" href="/">EventBooking</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/register">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="register-container">
  <div class="register-card">
    <h2>Welcome Back</h2>
    <p>Log in to explore and book amazing events!</p>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input name="username" class="form-control" id="username" placeholder="Enter username"
               [(formField)]="username"
               required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input name="password" type="password" class="form-control" id="password" placeholder="Enter password"
               [(formField)]="password" required>
      </div>

      @if (errorMessage) {

        <div class="text-danger mb-3">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn btn-success w-100">Login</button>
    </form>

    <p class="mt-3">Don’t have an account? <a routerLink="/register">Register here</a></p>
  </div>
</div>

<footer class="footer">
  &copy; 2026 EventBookingPlatform
</footer>
