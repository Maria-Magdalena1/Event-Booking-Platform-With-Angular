<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/">EventBooking</a>
    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" routerLink="/login">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="register-container">
  <div class="register-card">
    <h2>Create Your Account</h2>
    <p>Join the community and start booking amazing events!</p>

    <form [formRoot]="registerForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          [formField]="registerForm.username"
          class="form-control"
          id="username"
          placeholder="Enter username"
        />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          [formField]="registerForm.email"
          type="email"
          class="form-control"
          id="email"
          placeholder="Enter email"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          [formField]="registerForm.password"
          type="password"
          class="form-control"
          id="password"
          placeholder="Enter password"
        />
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          [formField]="registerForm.confirmPassword"
          type="password"
          class="form-control"
          id="confirmPassword"
          placeholder="Confirm password"
        />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger mt-3 text-center">
          {{ errorMessage() }}
        </div>
      }

      @if (registrationSuccessful()) {
        <div class="alert alert-success mt-3 text-center">
          {{ registrationSuccessful() }}
        </div>
      }

      <button type="submit" class="btn btn-success w-100">Register</button>
    </form>

    <p class="mt-3">Already have an account? <a routerLink="/login">Login here</a></p>

  </div>
</div>
