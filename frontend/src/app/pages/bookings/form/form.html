<div class="container my-5">
  <div class="card shadow-lg p-4 bg-white rounded">
    <div class="card-body">
      <h1 class="text-center mb-4">{{ event.name }}</h1>

      <p class="text-muted text-center mb-4">{{ event.description }}</p>

      <!-- ????????????????????????????????
      <form th:action="@{/bookings/create/{eventId}(eventId=${event.id})}"
            th:object="${booking}" method="post">
            -->
      <form (ngSubmit)="createBooking()">
        <!--
       <input type="hidden" name="_method" value="put"/>
       <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
       -->
        <div class="mb-3">
          <label for="seatsBooked" class="form-label">Number of Seats</label>
          <input
            id="seatsBooked"
            type="number"
            class="form-control"
            min="1"
            [max]="event.availableSeats"
            [(ngModel)]="seatsBooked"
            placeholder="Enter number of seats"
            required
          />

          <!--  <div class="text-danger" th:if="${#fields.hasErrors('seatsBooked')}"
             th:errors="*{seatsBooked}"></div>
        <div class="text-danger" th:if="${seatError}" th:text="${seatError}"></div>-->
          @if (seatsError) {
            <div class="text-danger">
              {{ seatsError }}
            </div>
          }

          @if (seatError) {
            <div class="text-danger">
              {{ seatError }}
            </div>
          }
          <small class="form-text text-muted"
            >Available seats: <span>{{ event.availableSeats }}</span></small
          >
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-success btn-lg">Book Now</button>
        </div>
      </form>
    </div>
  </div>

  <div class="text-center mt-3">
    <a [routerLink]="backUrl" class="btn btn-outline-secondary">&larr; Back </a>
  </div>
</div>
